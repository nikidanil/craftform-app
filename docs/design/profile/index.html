<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormCraft — Профиль</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          oklch(0.9818 0.0054 95.0986);
      --fg:          oklch(0.3438 0.0269 95.7226);
      --fg-dark:     oklch(0.1908 0.002  106.5859);
      --primary:     oklch(0.6171 0.1375 39.0427);
      --primary-hov: oklch(0.56   0.14   39);
      --secondary:   oklch(0.9245 0.0138 92.9892);
      --muted-fg:    oklch(0.6059 0.0075 97.4233);
      --border:      oklch(0.8847 0.0069 97.3627);
      --destructive: oklch(0.58   0.22   25);
      --radius:      0.65rem;
      --shadow:      0 2px 8px oklch(0 0 0 / 0.07), 0 1px 3px oklch(0 0 0 / 0.05);
      --shadow-lg:   0 8px 32px oklch(0 0 0 / 0.1), 0 4px 12px oklch(0 0 0 / 0.06);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .bg-blobs {
      position: fixed; inset: 0;
      overflow: hidden; pointer-events: none; z-index: 0;
    }
    .blob { position: absolute; border-radius: 50%; filter: blur(100px); }
    .blob-1 {
      width: 680px; height: 680px;
      background: oklch(0.86 0.06 39 / 0.28);
      top: -220px; right: -160px;
      animation: bf1 26s ease-in-out infinite;
    }
    .blob-2 {
      width: 560px; height: 560px;
      background: oklch(0.91 0.04 72 / 0.22);
      bottom: -180px; left: -120px;
      animation: bf2 32s ease-in-out infinite;
    }
    @keyframes bf1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-50px,40px) scale(1.06); } }
    @keyframes bf2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px,-35px) scale(0.94); } }

    /* ── Header ── */
    .header {
      position: relative; z-index: 10;
      background: white;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 4px oklch(0 0 0 / 0.05);
    }
    .header-inner {
      max-width: 1280px; margin: 0 auto;
      padding: 0 2rem; height: 60px;
      display: flex; align-items: center; gap: 2rem;
    }
    .logo {
      display: flex; align-items: center; gap: 0.5rem;
      text-decoration: none; color: var(--fg-dark); flex-shrink: 0;
    }
    .logo-icon {
      width: 30px; height: 30px;
      background: var(--primary);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 0.95rem;
      box-shadow: 0 2px 6px oklch(0.6171 0.1375 39 / 0.3);
    }
    .logo-name { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; color: var(--fg-dark); }

    .header-nav { display: flex; align-items: center; gap: 0.25rem; }
    .nav-link {
      padding: 0.4rem 0.875rem;
      border-radius: var(--radius);
      font-size: 0.9rem; font-weight: 500;
      color: var(--fg); text-decoration: none;
      transition: background 0.15s;
    }
    .nav-link:hover { background: var(--secondary); }
    .nav-link.new-form {
      background: var(--primary); color: white;
      box-shadow: 0 2px 6px oklch(0.6171 0.1375 39 / 0.28);
    }
    .nav-link.new-form:hover { background: var(--primary-hov); }

    .header-right { margin-left: auto; }
    .avatar-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--primary); color: white;
      font-size: 0.85rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow);
    }

    /* ── Main ── */
    .main {
      position: relative; z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 3rem 2rem 4rem;
    }

    .page-breadcrumb {
      font-size: 0.875rem;
      color: var(--muted-fg);
      margin-bottom: 2rem;
    }
    .page-breadcrumb a { color: var(--primary); text-decoration: none; }
    .page-breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb-sep { margin: 0 0.4rem; }

    /* ── Profile card ── */
    .profile-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Card header (avatar area) */
    .profile-card-head {
      background: linear-gradient(135deg, oklch(0.92 0.04 39 / 0.3), oklch(0.95 0.02 72 / 0.2));
      border-bottom: 1px solid var(--border);
      padding: 2.5rem 2rem 2rem;
      display: flex;
      align-items: flex-end;
      gap: 1.5rem;
      position: relative;
    }

    .avatar-large {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      font-size: 1.75rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      border: 4px solid white;
      box-shadow: 0 4px 16px oklch(0.6171 0.1375 39 / 0.35);
      flex-shrink: 0;
    }

    .profile-head-info h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--fg-dark);
    }
    .profile-head-info p {
      font-size: 0.9rem;
      color: var(--muted-fg);
      margin-top: 0.2rem;
    }

    .profile-head-actions {
      margin-left: auto;
      display: flex;
      gap: 0.5rem;
    }

    /* Card body (fields) */
    .profile-card-body {
      padding: 2rem;
    }

    .profile-section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted-fg);
      margin-bottom: 1.25rem;
    }

    .fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .fields-grid .field-full { grid-column: 1 / -1; }

    .field { display: flex; flex-direction: column; gap: 0.375rem; }

    .field-label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    .field-input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.9375rem;
      color: var(--fg-dark);
      background: oklch(0.9818 0.0054 95 / 0.4);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .field-input:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px oklch(0.6171 0.1375 39 / 0.14);
    }
    .field-input[readonly] {
      background: var(--secondary);
      cursor: default;
      color: var(--fg);
    }
    .field.error .field-input {
      border-color: var(--destructive);
      background: oklch(0.97 0.02 25 / 0.5);
    }
    .field-error {
      font-size: 0.8rem;
      color: var(--destructive);
      display: flex; align-items: center; gap: 0.35rem;
    }
    .field-error::before {
      content: ''; display: inline-block;
      width: 5px; height: 5px; border-radius: 50%;
      background: currentColor; flex-shrink: 0;
    }

    /* Action buttons */
    .profile-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      margin-top: 1.5rem;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.6rem 1.25rem;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: all 0.15s;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--primary); color: white;
      border-color: var(--primary);
      box-shadow: 0 2px 8px oklch(0.6171 0.1375 39 / 0.28);
    }
    .btn-primary:hover { background: var(--primary-hov); }
    .btn-secondary {
      background: white; color: var(--fg);
      border-color: var(--border);
    }
    .btn-secondary:hover { background: var(--secondary); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .edit-mode-badge {
      margin-left: auto;
      font-size: 0.78rem;
      color: var(--muted-fg);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <header class="header">
    <div class="header-inner">
      <a href="#" class="logo">
        <div class="logo-icon">✦</div>
        <span class="logo-name">FormCraft</span>
      </a>
      <nav class="header-nav">
        <a href="#" class="nav-link">Главная</a>
        <a href="#" class="nav-link new-form">+ Новая форма</a>
      </nav>
      <div class="header-right">
        <div class="avatar-btn">АИ</div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="page-breadcrumb">
      <a href="#">Главная</a>
      <span class="breadcrumb-sep">/</span>
      <span>Профиль</span>
    </div>

    <div class="profile-card">
      <!-- Card head -->
      <div class="profile-card-head">
        <div class="avatar-large">АИ</div>
        <div class="profile-head-info">
          <h1>Алексей Иванов</h1>
          <p>test@example2.com</p>
        </div>
      </div>

      <!-- Card body — edit mode -->
      <div class="profile-card-body">
        <p class="profile-section-title">Личные данные</p>

        <div class="fields-grid">
          <div class="field">
            <label class="field-label">Имя</label>
            <input type="text" class="field-input" value="Алексей">
          </div>
          <div class="field">
            <label class="field-label">Фамилия</label>
            <input type="text" class="field-input" value="Иванов">
          </div>
          <div class="field field-full error">
            <label class="field-label">Email</label>
            <input type="email" class="field-input" value="test@example2.com">
            <span class="field-error">Введённый Email уже занят</span>
          </div>
        </div>

        <div class="profile-actions">
          <button class="btn btn-secondary">Отменить</button>
          <button class="btn btn-primary" disabled>Сохранить</button>
          <span class="edit-mode-badge">Режим редактирования</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
