<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormCraft — Регистрация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          oklch(0.9818 0.0054 95.0986);
      --fg:          oklch(0.3438 0.0269 95.7226);
      --fg-dark:     oklch(0.1908 0.002  106.5859);
      --primary:     oklch(0.6171 0.1375 39.0427);
      --primary-hov: oklch(0.56   0.14   39);
      --muted-fg:    oklch(0.6059 0.0075 97.4233);
      --border:      oklch(0.8847 0.0069 97.3627);
      --destructive: oklch(0.58   0.22   25);
      --radius:      0.65rem;
      --shadow-lg:   0 12px 48px oklch(0 0 0 / 0.1), 0 4px 16px oklch(0 0 0 / 0.06);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      -webkit-font-smoothing: antialiased;
    }

    .bg-blobs {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .blob { position: absolute; border-radius: 50%; filter: blur(90px); }
    .blob-1 {
      width: 620px; height: 620px;
      background: oklch(0.84 0.07 39 / 0.36);
      top: -150px; right: -100px;
      animation: bf1 26s ease-in-out infinite;
    }
    .blob-2 {
      width: 500px; height: 500px;
      background: oklch(0.91 0.04 72 / 0.28);
      bottom: -120px; left: -80px;
      animation: bf2 32s ease-in-out infinite;
    }
    .blob-3 {
      width: 360px; height: 360px;
      background: oklch(0.89 0.03 160 / 0.18);
      top: 55%; left: 55%;
      animation: bf3 22s ease-in-out infinite;
    }
    @keyframes bf1 {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(-48px,32px) scale(1.06); }
      66%      { transform: translate(32px,-44px) scale(0.94); }
    }
    @keyframes bf2 {
      0%,100% { transform: translate(0,0) scale(1); }
      40%      { transform: translate(58px,-28px) scale(0.96); }
      80%      { transform: translate(-22px,52px) scale(1.04); }
    }
    @keyframes bf3 {
      0%,100% { transform: translate(0,0) scale(1); }
      50%      { transform: translate(38px,-54px) scale(1.09); }
    }

    .auth-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
      width: 100%;
    }

    .brand {
      display: flex; align-items: center; gap: 0.5rem;
      text-decoration: none; color: var(--fg-dark);
    }
    .brand-icon {
      width: 36px; height: 36px;
      background: var(--primary);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 1.1rem;
      box-shadow: 0 2px 8px oklch(0.6171 0.1375 39 / 0.35);
    }
    .brand-name {
      font-size: 1.35rem; font-weight: 700;
      letter-spacing: -0.025em; color: var(--fg-dark);
    }

    .auth-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .auth-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--fg-dark);
      margin-bottom: 0.3rem;
      letter-spacing: -0.01em;
    }
    .auth-subtitle {
      color: var(--muted-fg);
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }

    .auth-form { display: flex; flex-direction: column; gap: 1rem; }

    /* Two-column row for first+last name */
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

    .field { display: flex; flex-direction: column; gap: 0.375rem; }

    .field-label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    .field-input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.9375rem;
      color: var(--fg-dark);
      background: oklch(0.9818 0.0054 95 / 0.4);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .field-input:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px oklch(0.6171 0.1375 39 / 0.14);
    }
    .field.error .field-input {
      border-color: var(--destructive);
      background: oklch(0.97 0.02 25 / 0.5);
    }

    .field-error {
      font-size: 0.8rem;
      color: var(--destructive);
      display: flex; align-items: center; gap: 0.35rem;
    }
    .field-error::before {
      content: '';
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .btn-primary {
      width: 100%;
      padding: 0.75rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 2px 8px oklch(0.6171 0.1375 39 / 0.28);
      margin-top: 0.4rem;
    }
    .btn-primary:hover {
      background: var(--primary-hov);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px oklch(0.6171 0.1375 39 / 0.35);
    }

    .auth-link {
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted-fg);
      margin-top: 0.25rem;
    }
    .auth-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .auth-link a:hover { text-decoration: underline; }

    /* Password strength hint */
    .password-hint {
      font-size: 0.78rem;
      color: var(--muted-fg);
      margin-top: 0.1rem;
    }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="auth-wrapper">
    <a href="#" class="brand">
      <div class="brand-icon">✦</div>
      <span class="brand-name">FormCraft</span>
    </a>

    <div class="auth-card">
      <h1 class="auth-title">Создать аккаунт</h1>
      <p class="auth-subtitle">Начните создавать формы уже сегодня — бесплатно</p>

      <form class="auth-form" novalidate>
        <div class="field-row">
          <div class="field">
            <label class="field-label">Имя</label>
            <input type="text" class="field-input" value="Иван" placeholder="Иван">
          </div>
          <div class="field">
            <label class="field-label">Фамилия</label>
            <input type="text" class="field-input" value="Иванов" placeholder="Иванов">
          </div>
        </div>

        <div class="field">
          <label class="field-label">Email</label>
          <input type="email" class="field-input" value="test@example.com" placeholder="you@example.com">
        </div>

        <div class="field error">
          <label class="field-label">Пароль</label>
          <input type="password" class="field-input" value="12345">
          <span class="field-error">Пароль должен содержать минимум 8 символов</span>
        </div>

        <div class="field error">
          <label class="field-label">Повторить пароль</label>
          <input type="password" class="field-input" value="12345678">
          <span class="field-error">Пароли не совпадают</span>
        </div>

        <button type="submit" class="btn-primary">Зарегистрироваться</button>

        <p class="auth-link">
          Уже есть аккаунт? <a href="../login/">Войти</a>
        </p>
      </form>
    </div>
  </div>
</body>
</html>
